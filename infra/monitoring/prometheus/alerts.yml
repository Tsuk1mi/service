groups:
  - name: rimskiy
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High API error rate

      - alert: QueueDepthHigh
        expr: rabbitmq_queue_messages{queue="notifications"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Notification queue depth high

      - alert: NotificationsDlqNotEmpty
        expr: rabbitmq_queue_messages{queue="notifications.dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Notifications DLQ has messages
          description: Queue notifications.dlq depth is {{ $value }}. Check Telegram/FCM/SMS delivery and requeue after fix.
