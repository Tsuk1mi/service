apiVersion: v1
kind: ConfigMap
metadata:
  name: rimskiy-config
  namespace: rimskiy
data:
  # production: Swagger off, Redis required, SMS codes never returned in API
  APP_ENV: production
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  MIGRATIONS_PATH: ./migrations
  JWT_ACCESS_EXPIRATION_MINUTES: "15"
  JWT_REFRESH_EXPIRATION_MINUTES: "10080"
  RETURN_SMS_CODE_IN_RESPONSE: "false"
  OTP_RATE_LIMIT_MAX: "3"
  OTP_RATE_LIMIT_WINDOW_SECS: "900"
  OTP_VERIFY_MAX_ATTEMPTS: "5"
  # Redis required in production (OTP, rate limit, JWT blacklist)
  REDIS_URL: redis://redis:6379
  # Password comes from Secret; keep user/vhost in sync with rabbitmq StatefulSet
  # Prefer injecting full URL via Secret in overlays if password rotation is frequent.
  RABBITMQ_URL: amqp://rimskiy:CHANGE_ME@rabbitmq:5672/rimskiy
  TELEGRAM_BOT_HTTP_URL: http://telegram-bot:8081/send_code
  CORS_ALLOWED_ORIGINS: https://example.com
  WEB_APP_URL: https://example.com
