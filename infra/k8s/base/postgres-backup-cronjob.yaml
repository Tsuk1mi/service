apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: rimskiy
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: rimskiy-secrets
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - pg_dump -h postgres -U rimskiy rimskiy > /backup/rimskiy-$(date +%Y%m%d).sql
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-pvc
