apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: rimskiy-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.rimskiy.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.rimskiy.example.com

images:
  - name: ghcr.io/rimskiy/backend
    newTag: staging
  - name: ghcr.io/rimskiy/web
    newTag: staging
  - name: ghcr.io/rimskiy/notification-worker
    newTag: staging
