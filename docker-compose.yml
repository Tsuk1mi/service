services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rimskiy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rimskiy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rimskiy} -d ${POSTGRES_DB:-rimskiy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rimskiy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: rimskiy
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rimskiy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rimskiy}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rimskiy}:${RABBITMQ_PASSWORD}@rabbitmq:5672/rimskiy
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      JWT_REFRESH_EXPIRATION_MINUTES: ${JWT_REFRESH_EXPIRATION_MINUTES:-10080}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      MIGRATIONS_PATH: ./migrations
      RETURN_SMS_CODE_IN_RESPONSE: ${RETURN_SMS_CODE_IN_RESPONSE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      TELEGRAM_BOT_HTTP_URL: http://telegram-bot:8081/send_code
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      APP_ENV: ${APP_ENV:-production}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: ["/app/notification_worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rimskiy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rimskiy}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rimskiy}:${RABBITMQ_PASSWORD}@rabbitmq:5672/rimskiy
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: ["/app/telegram_bot"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rimskiy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rimskiy}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RETURN_SMS_CODE_IN_RESPONSE: ${RETURN_SMS_CODE_IN_RESPONSE:-false}
      API_BASE_URL: http://backend:8080
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      APP_ENV: ${APP_ENV:-production}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    profiles:
      - bot

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # --- Observability (profile: obs) ---
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [obs, full]
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [obs, full]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.0
    profiles: [obs, full]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.0
    profiles: [obs, full]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/monitoring/promtail/promtail-docker-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [obs, full]
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
