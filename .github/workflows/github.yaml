name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Получаем всю историю для тегов
      
      - name: Calculate version
        id: version
        run: |
          # Получаем последний тег
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          
          # Убираем префикс 'v' если есть
          VERSION=${LAST_TAG#v}
          echo "Version from tag: $VERSION"
          
          # Если тега нет или версия пустая, используем дефолтную
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
            VERSION="0.1.0"
          fi
          
          # Сохраняем в outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Update Cargo.toml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Updated Cargo.toml version to $VERSION"
          cat Cargo.toml | grep "^version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all --all-features

      - name: Cargo audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit || echo "cargo-audit advisory check completed"

      - name: Build release binaries
        run: |
          cargo build --release --bin rimskiy_service
          cargo build --release --bin telegram_bot
          cargo build --release --bin notification_worker

      - name: Upload backend binaries
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            target/release/rimskiy_service
            target/release/telegram_bot
            target/release/notification_worker
          retention-days: 7

  deploy-backend:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_KEY }}
      DEST: ${{ vars.BACKEND_DEPLOY_PATH }}
      SERVICE_NAME: ${{ vars.BACKEND_SERVICE_NAME }}
      TELEGRAM_BOT_SERVICE_NAME: ${{ vars.TELEGRAM_BOT_SERVICE_NAME }}
    steps:
      - name: Checkout (empty)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download backend artifacts
        if: ${{ env.HOST != '' && env.USER != '' && env.SSH_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: artifacts/

      - name: Prepare SSH
        if: ${{ env.HOST != '' && env.USER != '' && env.SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Проверяем формат SSH ключа
          echo "Checking SSH key format..."
          if ! head -n 1 ~/.ssh/id_rsa | grep -qE "BEGIN.*PRIVATE KEY"; then
            echo "⚠️  Warning: SSH key might be in wrong format"
            echo "First line of key:"
            head -n 1 ~/.ssh/id_rsa
            echo "Key should start with: -----BEGIN RSA PRIVATE KEY----- or -----BEGIN OPENSSH PRIVATE KEY-----"
          else
            echo "✅ SSH key format looks correct"
          fi
          
          # Добавляем хост в known_hosts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Тестируем подключение
          echo "Testing SSH connection to $USER@$HOST..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/id_rsa "$USER@$HOST" "echo 'SSH connection successful'" || {
            echo "❌ SSH connection test failed"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify SSH key is correctly added to GitHub Secret 'DEPLOY_KEY'"
            echo "2. Ensure public key is added to ~/.ssh/authorized_keys on server"
            echo "3. Check that user '$USER' exists on server"
            echo "4. Verify SSH service is running: sudo systemctl status sshd"
            echo "5. Check server logs: sudo tail -f /var/log/auth.log"
            echo ""
            echo "To add public key to server, run on your local machine:"
            echo "  ssh-copy-id -i ~/.ssh/id_rsa.pub $USER@$HOST"
            echo "Or manually add the public key to ~/.ssh/authorized_keys on server"
            exit 1
          }
          echo "✅ SSH connection successful"

      - name: Upload binaries and restart services
        if: ${{ env.HOST != '' && env.USER != '' && env.SSH_KEY != '' }}
        run: |
          set -e
          DEST_PATH=${DEST:-/opt/rimskiy-service}
          SERVICE=${SERVICE_NAME:-rimskiy-service}
          TELEGRAM_SERVICE=${TELEGRAM_BOT_SERVICE_NAME:-telegram-bot}
          
          echo "=== Deploying to $DEST_PATH ==="
          
          # Verify artifacts exist
          echo "Checking artifacts..."
          ls -lh artifacts/ || echo "Warning: artifacts directory not found"
          
          # Upload main service binary
          echo "=== Uploading main service binary ==="
          if [ -f artifacts/rimskiy_service ]; then
            scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no artifacts/rimskiy_service "$USER@$HOST:/tmp/rimskiy_service"
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo mkdir -p $DEST_PATH && sudo mv /tmp/rimskiy_service $DEST_PATH/rimskiy_service && sudo chmod +x $DEST_PATH/rimskiy_service"
            echo "Main service binary deployed"
            
            # Check if main service exists
            echo "Checking if main service exists: $SERVICE"
            SERVICE_EXISTS=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl list-unit-files | grep -c $SERVICE || echo '0'")
            
            if [ "$SERVICE_EXISTS" != "0" ]; then
              echo "Main service found: $SERVICE"
              
              # Проверяем конфигурацию сервиса и исправляем если нужно
              echo "Checking service configuration..."
              SERVICE_FILE="/etc/systemd/system/$SERVICE.service"
              CURRENT_USER=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "whoami")
              
              # Проверяем, правильно ли настроен ExecStart
              EXEC_START=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep '^ExecStart=' $SERVICE_FILE | cut -d'=' -f2-" || echo "")
              if [ -z "$EXEC_START" ] || [ "$EXEC_START" != "$DEST_PATH/rimskiy_service" ]; then
                echo "Fixing ExecStart in service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i 's|^ExecStart=.*|ExecStart=$DEST_PATH/rimskiy_service|' $SERVICE_FILE || true"
              fi
              
              # Проверяем, есть ли WorkingDirectory
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^WorkingDirectory=' $SERVICE_FILE"; then
                echo "Adding WorkingDirectory to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^\[Service\]/a WorkingDirectory=$DEST_PATH' $SERVICE_FILE || true"
              fi
              
              # Проверяем, есть ли EnvironmentFile
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^EnvironmentFile=' $SERVICE_FILE"; then
                echo "Adding EnvironmentFile to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^WorkingDirectory=/a EnvironmentFile=-$DEST_PATH/.env' $SERVICE_FILE || true"
              fi
              
              # Проверяем User
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^User=' $SERVICE_FILE"; then
                echo "Adding User to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^\[Service\]/a User=$CURRENT_USER' $SERVICE_FILE || true"
              fi
              
              # Reload systemd daemon (в случае обновления конфигурации)
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl daemon-reload"
              
              # Проверяем наличие .env файла
              echo "Checking .env file..."
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo test -f $DEST_PATH/.env"; then
                echo "⚠️  WARNING: .env file not found at $DEST_PATH/.env"
                echo "The service needs .env file with DATABASE_URL, JWT_SECRET, etc."
              else
                echo "✅ .env file exists"
              fi
              
              # Проверяем права на бинарный файл
              echo "Checking binary permissions..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo ls -la $DEST_PATH/rimskiy_service"
              
              # Restart main service
              echo "Restarting main service: $SERVICE"
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl restart $SERVICE || echo 'Warning: Failed to restart $SERVICE'"
              
              # Wait a bit for service to start
              sleep 5
              
              # Check service status
              echo "Checking main service status..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl status $SERVICE --no-pager -l || true"
              
              # Verify service is running
              SERVICE_STATUS=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl is-active $SERVICE || echo 'inactive'")
              if [ "$SERVICE_STATUS" = "active" ]; then
                echo "✅ Main service is running"
              else
                echo "⚠️  Warning: Main service is not active. Status: $SERVICE_STATUS"
                echo "Checking recent logs..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo journalctl -u $SERVICE -n 30 --no-pager || true"
                
                # Показываем текущую конфигурацию сервиса
                echo "Current service configuration:"
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo cat $SERVICE_FILE || echo 'Service file not found'"
              fi
            else
              echo "⚠️  Warning: Main service '$SERVICE' not found."
              echo "Creating systemd service file..."
              
              # Создаем systemd сервис автоматически
              CURRENT_USER=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "whoami")
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "printf '%s\n' '[Unit]' 'Description=Rimskiy Service' 'After=network.target postgresql.service' '' '[Service]' 'Type=simple' \"User=$CURRENT_USER\" \"WorkingDirectory=$DEST_PATH\" \"ExecStart=$DEST_PATH/rimskiy_service\" 'Restart=always' 'RestartSec=10' 'Environment=\"RUST_LOG=info\"' \"EnvironmentFile=-$DEST_PATH/.env\" '' '[Install]' 'WantedBy=multi-user.target' | sudo tee /etc/systemd/system/$SERVICE.service > /dev/null"
              
              echo "Service file created. Reloading systemd..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl daemon-reload"
              echo "Enabling and starting service..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl enable $SERVICE && sudo systemctl start $SERVICE || echo 'Failed to start service'"
              sleep 5
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl status $SERVICE --no-pager -l || true"
              
              # Verify service is running
              SERVICE_STATUS=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl is-active $SERVICE || echo 'inactive'")
              if [ "$SERVICE_STATUS" = "active" ]; then
                echo "✅ Main service created and started successfully"
              else
                echo "⚠️  Warning: Main service failed to start. Status: $SERVICE_STATUS"
                echo "Checking recent logs..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo journalctl -u $SERVICE -n 30 --no-pager || true"
              fi
            fi
          else
            echo "Error: rimskiy_service binary not found in artifacts"
            exit 1
          fi
          
          # Upload and restart telegram bot
          echo "=== Deploying Telegram bot ==="
          if [ -f artifacts/telegram_bot ]; then
            echo "Uploading telegram bot binary..."
            scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no artifacts/telegram_bot "$USER@$HOST:/tmp/telegram_bot"
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo mkdir -p $DEST_PATH && sudo mv /tmp/telegram_bot $DEST_PATH/telegram_bot && sudo chmod +x $DEST_PATH/telegram_bot"
            echo "Telegram bot binary deployed to $DEST_PATH/telegram_bot"
            
            # Verify binary exists and is executable
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "ls -lh $DEST_PATH/telegram_bot && file $DEST_PATH/telegram_bot || echo 'Warning: Binary verification failed'"
            
            # Check if telegram bot service exists
            echo "Checking if telegram bot service exists: $TELEGRAM_SERVICE"
            SERVICE_EXISTS=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl list-unit-files | grep -c $TELEGRAM_SERVICE || echo '0'")
            
            if [ "$SERVICE_EXISTS" != "0" ]; then
              echo "Telegram bot service found: $TELEGRAM_SERVICE"
              
              # Проверяем конфигурацию сервиса и исправляем если нужно
              echo "Checking service configuration..."
              SERVICE_FILE="/etc/systemd/system/$TELEGRAM_SERVICE.service"
              CURRENT_USER=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "whoami")
              
              # Проверяем, правильно ли настроен ExecStart
              EXEC_START=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep '^ExecStart=' $SERVICE_FILE | cut -d'=' -f2-" || echo "")
              if [ -z "$EXEC_START" ] || [ "$EXEC_START" != "$DEST_PATH/telegram_bot" ]; then
                echo "Fixing ExecStart in service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i 's|^ExecStart=.*|ExecStart=$DEST_PATH/telegram_bot|' $SERVICE_FILE || true"
              fi
              
              # Проверяем, есть ли WorkingDirectory
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^WorkingDirectory=' $SERVICE_FILE"; then
                echo "Adding WorkingDirectory to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^\[Service\]/a WorkingDirectory=$DEST_PATH' $SERVICE_FILE || true"
              fi
              
              # Проверяем, есть ли EnvironmentFile
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^EnvironmentFile=' $SERVICE_FILE"; then
                echo "Adding EnvironmentFile to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^WorkingDirectory=/a EnvironmentFile=-$DEST_PATH/.env' $SERVICE_FILE || true"
              fi
              
              # Проверяем User
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^User=' $SERVICE_FILE"; then
                echo "Adding User to service file..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo sed -i '/^\[Service\]/a User=$CURRENT_USER' $SERVICE_FILE || true"
              fi
              
              # Reload systemd daemon (в случае обновления конфигурации)
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl daemon-reload"
              
              # Проверяем наличие .env файла и необходимых переменных
              echo "Checking .env file..."
              if ! ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo test -f $DEST_PATH/.env"; then
                echo "⚠️  WARNING: .env file not found at $DEST_PATH/.env"
                echo "The service needs .env file with DATABASE_URL, TELEGRAM_BOT_TOKEN, etc."
              else
                echo "✅ .env file exists"
                echo "Checking required variables in .env file..."
                REQUIRED_VARS=("TELEGRAM_BOT_TOKEN" "DATABASE_URL")
                for VAR in "${REQUIRED_VARS[@]}"; do
                  if ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo grep -q '^${VAR}=' $DEST_PATH/.env 2>/dev/null"; then
                    echo "✅ $VAR is set in .env"
                  else
                    echo "⚠️  WARNING: $VAR is missing in .env file"
                  fi
                done
              fi
              
              # Проверяем права на бинарный файл
              echo "Checking binary permissions..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo ls -la $DEST_PATH/telegram_bot"
              
              # Restart telegram bot service
              echo "Restarting telegram bot service..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl restart $TELEGRAM_SERVICE || echo 'Warning: Failed to restart $TELEGRAM_SERVICE'"
              
              # Wait a bit for service to start
              sleep 5
              
              # Check service status
              echo "Checking telegram bot service status..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl status $TELEGRAM_SERVICE --no-pager -l || true"
              
              # Verify service is running
              SERVICE_STATUS=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl is-active $TELEGRAM_SERVICE || echo 'inactive'")
              if [ "$SERVICE_STATUS" = "active" ]; then
                echo "✅ Telegram bot service is running"
              else
                echo "⚠️  Warning: Telegram bot service is not active. Status: $SERVICE_STATUS"
                echo "Checking recent logs..."
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo journalctl -u $TELEGRAM_SERVICE -n 30 --no-pager || true"
                
                # Показываем текущую конфигурацию сервиса
                echo "Current service configuration:"
                ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo cat $SERVICE_FILE || echo 'Service file not found'"
              fi
            else
              echo "⚠️  Warning: Telegram bot service '$TELEGRAM_SERVICE' not found."
              echo "Creating systemd service file..."
              
              # Создаем systemd сервис автоматически
              CURRENT_USER=$(ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "whoami")
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "printf '%s\n' '[Unit]' 'Description=Telegram Bot for Rimskiy Service' 'After=network.target' '' '[Service]' 'Type=simple' \"User=$CURRENT_USER\" \"WorkingDirectory=$DEST_PATH\" \"ExecStart=$DEST_PATH/telegram_bot\" 'Restart=always' 'RestartSec=10' 'Environment=\"RUST_LOG=info\"' \"EnvironmentFile=-$DEST_PATH/.env\" '' '[Install]' 'WantedBy=multi-user.target' | sudo tee /etc/systemd/system/$TELEGRAM_SERVICE.service > /dev/null"
              
              echo "Service file created. Reloading systemd..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl daemon-reload"
              echo "Enabling and starting service..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl enable $TELEGRAM_SERVICE && sudo systemctl start $TELEGRAM_SERVICE || echo 'Failed to start service'"
              sleep 3
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "sudo systemctl status $TELEGRAM_SERVICE --no-pager -l || true"
            fi
          else
            echo "⚠️  Warning: telegram_bot binary not found in artifacts"
            echo "Available artifacts:"
            ls -lh artifacts/ || echo "No artifacts found"
          fi
          
          echo "=== Deployment completed ==="

  web:
    name: Web (Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Test frontend
        working-directory: web
        run: npm run test -- --run

      - name: NPM audit
        working-directory: web
        run: npm audit --audit-level=high || echo "npm audit completed"

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy-web:
    name: Deploy Web to Server
    runs-on: ubuntu-latest
    needs: web
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      HOST: ${{ vars.WEB_DEPLOY_HOST }}
      USER: ${{ vars.WEB_DEPLOY_USER }}
      SSH_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
      DEST: ${{ vars.WEB_DEPLOY_PATH }}
    steps:
      - name: Download web artifact
        if: ${{ env.HOST != '' && env.USER != '' && env.SSH_KEY != '' }}
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: artifacts/web

      - name: Deploy static files
        if: ${{ env.HOST != '' && env.USER != '' && env.SSH_KEY != '' }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          DEST_PATH=${DEST:-/var/www/rimskiy/web}
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$USER@$HOST" "mkdir -p $DEST_PATH"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r artifacts/web/* "$USER@$HOST:$DEST_PATH/"
          echo "Web deployed to $DEST_PATH"

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest

  deploy-k8s-staging:
    name: Deploy to K8s Staging
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && vars.K8S_STAGING_ENABLED == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" > ~/.kube/config

      - name: Deploy staging overlay
        run: |
          kubectl apply -k infra/k8s/overlays/staging
          kubectl rollout status deployment/backend -n rimskiy --timeout=120s

  deploy-k8s-prod:
    name: Deploy to K8s Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && vars.K8S_PROD_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" > ~/.kube/config

      - name: Run migrations
        run: kubectl apply -f infra/k8s/base/db-migrate-job.yaml -n rimskiy

      - name: Deploy production overlay
        run: |
          kubectl apply -k infra/k8s/overlays/prod
          kubectl rollout status deployment/backend -n rimskiy --timeout=180s
